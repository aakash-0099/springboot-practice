spring.application.name=user-management-service

server.port=8081

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=postgres
spring.datasource.password=admin@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable or disable LiveReload (enabled by default) browser changes
spring.devtools.livereload.enabled=true

# Disable restart feature (enabled by default) backend changes
spring.devtools.restart.enabled=true

# JWT settings
jwt.secret=jPI2R8zA8Qw16vdNXRqUsFW5eIpwmTnNOe6pF6Y5e4k=
jwt.expiration=3600000


# Logging configuration
logging.level.org.springframework.web=DEBUG

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Rate Limiting
rate-limit.enabled=true
rate-limit.capacity=100
rate-limit.refill-tokens=100
rate-limit.refill-duration-seconds=60


#Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms